services:
  user-service:
    build: ./services/user-service
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  order-service:
    build: ./services/order-service
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  product-service:
    build: ./services/product-service
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ./gateway
      target: runtime
    command:
      - --config
      - /etc/gateway/config.yaml
      - --tls-cert
      - /run/gateway-certs/server.crt
      - --tls-key
      - /run/gateway-certs/server.key
    ports:
      - "8443:8443"
    volumes:
      - ./gateway/config.example.yaml:/etc/gateway/config.yaml:ro
      - ./gateway/.local/certs:/run/gateway-certs:ro
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
